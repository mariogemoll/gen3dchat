name = "gen3dchat"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]
pages_build_output_dir = "frontend/dist"

[[kv_namespaces]]
binding = "..."
id = "..."

[[d1_databases]]
binding = "..."
database_name = "..."
database_id = "..."

[[env.preview.kv_namespaces]]
binding = "..."
id = "..."

[[env.preview.d1_databases]]
binding = "..."
database_name = "..."
database_id = "..."

# Required secrets (encrypted environment variables):
#   OPENAI_API_KEY - OpenAI API key
#   SQIDS_THREAD_ALPHABET - Custom alphabet for thread ID encoding (keep secret!)
#   SQIDS_CHECKPOINT_ALPHABET - Custom alphabet for checkpoint ID encoding (keep secret!)
#
# Optional:
#   LANGCHAIN_TRACING_V2, LANGCHAIN_API_KEY, LANGCHAIN_PROJECT
#
# Generate custom Sqids alphabets by shuffling: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
# Use different shuffles for SQIDS_THREAD_ALPHABET and SQIDS_CHECKPOINT_ALPHABET
# NEVER commit these alphabets to source control!
