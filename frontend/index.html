<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEN3D.CHAT</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #0a0a0a;
        color: #e5e5e5;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 16px 24px;
        border-bottom: 1px solid #333;
        background: #111;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .message {
        display: flex;
        gap: 12px;
        max-width: 800px;
      }
      .message.user {
        align-self: flex-end;
        flex-direction: row-reverse;
      }
      .message .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        flex-shrink: 0;
      }
      .message.user .avatar {
        background: #4a9eff;
      }
      .message .content {
        background: #1a1a1a;
        padding: 12px 16px;
        border-radius: 12px;
        line-height: 1.5;
      }
      .message.user .content {
        background: #2a5a8f;
      }
      #chatForm {
        padding: 16px 24px;
        border-top: 1px solid #333;
        background: #111;
        display: flex;
        gap: 12px;
      }
      #chatInput {
        flex: 1;
        padding: 12px 16px;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 8px;
        color: #e5e5e5;
        font-size: 14px;
        font-family: inherit;
      }
      #chatInput:focus {
        outline: none;
        border-color: #4a9eff;
      }
      button {
        padding: 12px 24px;
        background: #4a9eff;
        border: none;
        border-radius: 8px;
        color: white;
        font-weight: 500;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #3a8eef;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>GEN3D.CHAT</h1>
    </header>
    <div id="messages"></div>
    <form id="chatForm">
      <input id="chatInput" name="message" placeholder="Type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
