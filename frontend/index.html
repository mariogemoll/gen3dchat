<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GEN3D.CHAT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid #333;
      background: #111;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
    }

    #mainContainer {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    #codePanel {
      width: 50%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #333;
      background: #0a0a0a;
    }

    #codeHeader {
      padding: 12px 16px;
      border-bottom: 1px solid #333;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #codeHeader h2 {
      font-size: 14px;
      font-weight: 600;
      color: #999;
    }

    #saveButton {
      padding: 8px 16px;
      background: #4a9eff;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: 500;
      cursor: pointer;
      font-size: 13px;
    }

    #saveButton:hover:not(:disabled) {
      background: #3a8eef;
    }

    #saveButton:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      background: #333;
    }

    #codeEditor {
      flex: 1;
      padding: 16px;
      background: #0a0a0a;
      border: none;
      color: #e5e5e5;
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      resize: none;
      outline: none;
    }

    #chatPanel {
      width: 50%;
      display: flex;
      flex-direction: column;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 800px;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .message.user .avatar {
      background: #4a9eff;
    }

    .message .content {
      background: #1a1a1a;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user .content {
      background: #2a5a8f;
    }

    .message .content code {
      background: #0a0a0a;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      font-size: 12px;
    }

    .message .content pre {
      background: #0a0a0a;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
    }

    .message .content pre code {
      background: none;
      padding: 0;
    }

    .update-label {
      text-align: center;
      padding: 8px 16px;
      margin: 8px auto;
      max-width: 200px;
      background: #1a3a1a;
      border: 1px solid #2a5a2a;
      border-radius: 6px;
      color: #7aff7a;
      font-size: 13px;
      font-weight: 500;
    }

    .update-label.loading {
      background: #3a3a1a;
      border-color: #5a5a2a;
      color: #ffff7a;
    }

    #chatForm {
      padding: 16px 24px;
      border-top: 1px solid #333;
      background: #111;
      display: flex;
      gap: 12px;
    }

    #chatInput {
      flex: 1;
      padding: 12px 16px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e5e5e5;
      font-size: 14px;
      font-family: inherit;
    }

    #chatInput:focus {
      outline: none;
      border-color: #4a9eff;
    }

    #sendButton {
      padding: 12px 24px;
      background: #4a9eff;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 500;
      cursor: pointer;
      font-size: 14px;
    }

    #sendButton:hover:not(:disabled) {
      background: #3a8eef;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <header>
    <h1>GEN3D.CHAT - Code Editor</h1>
  </header>
  <div id="mainContainer">
    <div id="codePanel">
      <div id="codeHeader">
        <h2>CODE</h2>
        <button id="saveButton" disabled>Save Code</button>
      </div>
      <textarea id="codeEditor" placeholder="# Write your code here...
# Valid commands: SET, PRINT, ADD, IF/END
# Example:
# SET x 10
# PRINT x"></textarea>
    </div>
    <div id="chatPanel">
      <div id="messages"></div>
      <form id="chatForm">
        <input id="chatInput" name="message" placeholder="Type a message or request..." autocomplete="off" />
        <button id="sendButton" type="submit">Send</button>
      </form>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
